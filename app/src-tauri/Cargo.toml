[package]
name = "handler"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "handler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "~2.7.0"
tauri-plugin-notification = "~2.8.0"
tauri-plugin-single-instance = "~2.5.4"
ureq = { version = "2.12", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
