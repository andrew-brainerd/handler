<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tally</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0d0f12;
    --card: #171a1f;
    --line: #262a31;
    --text: #e8e6e1;
    --dim: #8b8f97;
    --red: #ff4d3d;
    --amber: #f2b33d;
    --green: #4fd18b;
    --grey: #5b6068;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; width: 1920px; height: 1080px; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--bg); padding: 56px 72px; display: flex; flex-direction: column; gap: 36px; }
  header { display: flex; align-items: baseline; gap: 28px; }
  .brand { font-size: 44px; font-weight: 700; letter-spacing: .02em; display: flex; align-items: center; gap: 16px; }
  .lamp { width: 22px; height: 22px; border-radius: 50%; background: var(--grey); box-shadow: 0 0 0 4px #ffffff10; transition: background .3s, box-shadow .3s; }
  .lamp.live { background: var(--red); box-shadow: 0 0 24px 6px #ff4d3d88; animation: pulse 1.6s ease-in-out infinite; }
  .counts { font-size: 30px; color: var(--dim); }
  .counts b { color: var(--text); font-weight: 600; }
  .clock { margin-left: auto; font-size: 40px; font-variant-numeric: tabular-nums; color: var(--dim); }
  #banner { position: absolute; left: 50%; top: 28px; z-index: 5; max-width: 1500px; display: flex; align-items: center; gap: 22px; padding: 22px 40px 22px 30px; background: #232a33; color: var(--text); border: 2px solid #3a4350; border-radius: 999px; box-shadow: 0 18px 50px #000a; font-size: 32px; font-weight: 600; white-space: nowrap; transform: translate(-50%, -160%); opacity: 0; transition: transform .4s ease, opacity .4s ease; }
  #banner.show { transform: translate(-50%, 0); opacity: 1; }
  #banner .dot { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 16px var(--amber); }
  #banner .text { overflow: hidden; text-overflow: ellipsis; }
  #banner .project { color: var(--amber); }
  .md { color: var(--dim); white-space: pre-line; line-height: 1.45; }
  .md b, .md code { color: var(--text); }
  .md code { font-family: Consolas, monospace; font-size: .9em; }
  #rows { flex: 1; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .row { flex: 0 0 152px; background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px 28px 16px 20px; display: grid; grid-template-columns: 104px minmax(0, 1fr) 520px 96px; column-gap: 28px; align-items: center; position: relative; overflow: hidden; cursor: pointer; }
  .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--accent, var(--grey)); }
  .row.working { --accent: var(--green); }
  .row.waiting { --accent: var(--amber); }
  .row.needs_permission, .row.asking { --accent: var(--red); border-color: #ff4d3d99; box-shadow: 0 0 36px #ff4d3d33; }
  .row.stale, .row.ended { opacity: .55; }
  .avatar { width: 96px; height: 96px; border-radius: 18px; background: var(--hue); display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 700; color: #0d0f12; margin-left: 8px; box-shadow: 0 0 0 4px var(--accent, var(--grey)); image-rendering: pixelated; }
  .row.needs_permission .avatar:not(.sprite), .row.asking .avatar:not(.sprite) { animation: bob 1s ease-in-out infinite; }
  .avatar.sprite { background: #0f1216; position: relative; }
  .avatar.sprite .img { border-radius: inherit; width: 100%; height: 100%; background-image: var(--sheet); background-repeat: no-repeat; background-size: calc(var(--frames) * 100%) 100%; image-rendering: pixelated; animation: sprite var(--dur) steps(var(--frames), jump-none) var(--iter) both; filter: hue-rotate(var(--tint)); }
  .avatar.sprite.still .img { background-size: 100% 100%; animation: none; }
  .bubble { position: absolute; top: -14px; right: -14px; width: 40px; height: 36px; border-radius: 50%; background: #f4f1ea; color: #14171c; font-size: 26px; font-weight: 800; line-height: 36px; text-align: center; box-shadow: 0 0 0 3px #14171c; animation: bob 1.2s ease-in-out infinite; }
  .bubble::before, .bubble::after { content: ""; position: absolute; border-radius: 50%; background: #f4f1ea; box-shadow: 0 0 0 3px #14171c; }
  .bubble::before { width: 10px; height: 10px; left: -1px; bottom: -6px; }
  .bubble::after { width: 6px; height: 6px; left: -9px; bottom: -13px; }
  .main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .line1 { display: flex; align-items: baseline; gap: 16px; min-width: 0; white-space: nowrap; }
  .project { font-size: 36px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; max-width: 60%; }
  .branch { font-size: 22px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
  .state { font-size: 26px; font-weight: 600; color: var(--accent, var(--dim)); flex-shrink: 0; }
  .request { font-size: 28px; line-height: 1.25; color: #ffd9d4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .request + .summary { -webkit-line-clamp: 1; color: var(--dim); font-size: 24px; }
  .row.compact { flex-basis: 96px; padding-top: 10px; padding-bottom: 10px; grid-template-columns: 104px minmax(0, 1fr) 520px 96px; }
  .row.compact .avatar { width: 64px; height: 64px; font-size: 32px; border-radius: 14px; margin-left: 24px; }
  .row.compact .project { font-size: 30px; }
  .row.compact .summary { -webkit-line-clamp: 1; font-size: 24px; }
  .row.compact .activity div:nth-child(n + 2) { display: none; }
  .activity .sub::before { content: "▸ "; color: var(--accent, var(--dim)); }
  .summary { font-size: 28px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .summary.prompt, .summary.message { color: var(--dim); }
  .summary.prompt { font-style: italic; }
  .question { font-size: 28px; line-height: 1.25; color: #ffd9d4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .question .options { color: var(--dim); font-size: 24px; }
  .activity { font-size: 21px; line-height: 1.45; color: var(--dim); border-left: 2px solid var(--line); padding-left: 22px; min-width: 0; }
  .activity div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .activity div:first-child { color: var(--text); }
  .activity .tags { color: var(--text); }
  .ago { font-size: 26px; color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
  .more { flex: 0 0 64px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: var(--dim); }
  .empty { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 48px; color: var(--dim); }
  .slide { flex: 1; display: grid; grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; column-gap: 24px; min-height: 0; cursor: pointer; }
  .slide .avatar { width: 192px; height: 192px; margin: 0; font-size: 96px; border-radius: 28px; --accent: var(--amber); grid-row: 1 / 3; }
  .slide h2 { font-size: 52px; margin: 0; align-self: end; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slide .meta { font-size: 30px; color: var(--amber); margin-top: 8px; }
  .slide .meta + .gist { margin-top: 10px; }
  .slide .gist { grid-column: 2; font-size: 30px; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .slide .message { grid-column: 1 / -1; border-top: 2px solid var(--line); margin-top: 28px; padding-top: 28px; font-size: 32px; color: var(--text); overflow: hidden; min-height: 0; }
  .slide .message.long { font-size: 28px; }
  .slide .message.longer { font-size: 24px; }
  .slide .footer { grid-column: 1 / -1; text-align: center; font-size: 26px; color: var(--dim); padding-top: 16px; }
  .offline { position: absolute; right: 72px; bottom: 28px; font-size: 24px; color: var(--amber); display: none; }
  .offline.show { display: block; }
  #detail { position: absolute; inset: 0; z-index: 4; background: var(--bg); padding: 72px 96px; display: none; flex-direction: column; gap: 22px; font-size: 30px; overflow: auto; }
  #detail.show { display: flex; }
  #detail h2 { font-size: 52px; margin: 0; }
  #detail .label { color: var(--dim); font-size: 24px; text-transform: uppercase; letter-spacing: .08em; margin-top: 12px; }
  #detail ol { margin: 0; padding-left: 1.2em; line-height: 1.5; }
  #detail .close { position: absolute; right: 72px; top: 60px; font-size: 26px; color: var(--dim); }
  @keyframes pulse { 50% { box-shadow: 0 0 8px 2px #ff4d3d55; } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes sprite { from { background-position: 0 0; } to { background-position: 100% 0; } }
</style>
</head>
<body>
<div id="stage">
  <div id="banner"><span class="dot"></span><span class="text"></span></div>
  <header>
    <div class="brand"><span class="lamp" id="lamp"></span>Tally</div>
    <div class="counts" id="counts"></div>
    <div class="clock" id="clock"></div>
  </header>
  <div id="rows"></div>
  <div class="offline" id="offline">Can't reach the relay. Showing the last update.</div>
  <div id="detail"></div>
</div>
<script>
  const STATE_TEXT = { working: 'Working', waiting: 'Done, waiting for you', needs_permission: 'Needs permission', asking: 'Asked a question', stale: 'No activity for 30 min', ended: 'Ended' };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  let status = { sessions: [] };
  let seenNeedsYou = new Set();
  let openId = null;
  let bannerTimer = null;
  let slideId = null;
  let browsingUntil = 0;
  let slideTimer = null;
  const SLIDE_MS = 20000;
  const BROWSE_MS = 30000;

  function fit() {
    const stage = $('stage');
    const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.left = `${innerWidth / 2 - (1920 * scale) / 2}px`;
    stage.style.top = `${innerHeight / 2 - (1080 * scale) / 2}px`;
    stage.style.transform = `scale(${scale})`;
  }

  function ago(iso) {
    const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.floor(s / 60)}m`;
    return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
  }

  function hue(text) {
    let h = 0;
    for (const c of text) h = (h * 31 + c.charCodeAt(0)) % 360;
    return `hsl(${h} 55% 62%)`;
  }

  const COMPACT = new Set(['waiting', 'stale', 'ended']);
  const ROW_HEIGHT = { full: 152, compact: 96, gap: 16, more: 56 };

  function splitDetail(s) {
    const m = /^Needs permission(?:: (.*?))?(?: \(([^()]+)\))?$/.exec(s.detail ?? '');
    if (s.state !== 'needs_permission' || !m) return { stateText: s.detail ?? STATE_TEXT[s.state], request: null };
    return { stateText: m[2] ? `Needs permission · ${m[2]}` : 'Needs permission', request: m[1] ?? null };
  }

  const SHRUG_MS = 8000;
  const avatars = new Map();

  function spriteState(s) {
    if (s.state === 'ended') return null;
    if (s.needsYou) return 'puzzled';
    if (s.state === 'working') return 'working';
    if (s.state === 'stale') return 'bored';
    if ((s.detail === 'You said no' || s.detail === 'Interrupted') && Date.now() - Date.parse(s.since) < SHRUG_MS) return 'puzzled';
    return 'sleeping';
  }

  const bubbleFor = (s) => (s.state === 'asking' ? '?' : s.state === 'needs_permission' ? '!' : '');

  function avatarKey(s) {
    const c = s.character;
    const anim = spriteState(s);
    return `${s.id}|${c.id}|${c.tint}|${anim && c.states[anim] ? anim : 'still'}|${bubbleFor(s)}`;
  }

  function makeAvatar(s, key) {
    const c = s.character;
    const [, , , anim, bubble] = key.split('|');
    const el = document.createElement('div');
    el.className = 'avatar sprite';
    el.innerHTML = `<div class="img"></div>${bubble ? `<div class="bubble">${esc(bubble)}</div>` : ''}`;
    el.style.setProperty('--tint', `${c.tint}deg`);
    if (anim === 'still') {
      el.classList.add('still');
      el.style.setProperty('--sheet', `url(/characters/${c.id}/${c.still})`);
    } else {
      const a = c.states[anim];
      el.style.setProperty('--sheet', `url(/characters/${c.id}/${a.file})`);
      el.style.setProperty('--frames', a.frames);
      el.style.setProperty('--dur', `${a.frames / a.fps}s`);
      el.style.setProperty('--iter', a.loop ? 'infinite' : '1');
    }
    return el;
  }

  function mountAvatars(sessions) {
    const used = new Set();
    for (const slot of document.querySelectorAll('.avatar-slot')) {
      const key = slot.dataset.key;
      const s = sessions.find((x) => x.id === key.split('|')[0]);
      if (!avatars.has(key)) avatars.set(key, makeAvatar(s, key));
      slot.replaceWith(avatars.get(key));
      used.add(key);
    }
    for (const key of avatars.keys()) if (!used.has(key)) avatars.delete(key);
  }

  let manyHosts = false;
  const shortHost = (host) => (host ?? '').split('.')[0];

  function row(s) {
    const where = manyHosts ? shortHost(s.host) : '';
    const branch = [s.branch, where].filter(Boolean).join(' · ');
    const { stateText, request } = splitDetail(s);
    const summary = s.summary ? `<div class="summary ${s.summarySource ?? ''}">${esc(s.summary)}</div>` : '';
    const body = s.question
      ? `<div class="question">${esc(s.question.text)}${s.question.options.length ? ` <span class="options">${s.question.options.map(esc).join(' · ')}</span>` : ''}</div>`
      : request
        ? `<div class="request">${esc(request)}</div>${summary}`
        : summary;
    const tags = [s.todo && `${s.todo.done}/${s.todo.total} tasks`, s.subagents && `${s.subagents} subagent${s.subagents > 1 ? 's' : ''}`].filter(Boolean).join(' · ');
    const lines = s.activity.slice(0, tags ? 2 : 3).map((a) => (a.startsWith('↳ ') ? `<div class="sub">${esc(a.slice(2))}</div>` : `<div>${esc(a)}</div>`));
    if (tags) lines.push(`<div class="tags">${esc(tags)}</div>`);
    return `<div class="row ${s.state}${COMPACT.has(s.state) ? ' compact' : ''}" data-id="${s.id}">
      ${s.character ? `<div class="avatar-slot" data-key="${esc(avatarKey(s))}"></div>` : `<div class="avatar" style="--hue:${hue(s.project)}">${esc(s.project[0]?.toUpperCase() ?? '?')}</div>`}
      <div class="main">
        <div class="line1"><span class="project">${esc(s.project)}</span>${branch ? `<span class="branch">${esc(branch)}</span>` : ''}<span class="state">${esc(stateText)}</span></div>
        ${body}
      </div>
      <div class="activity">${lines.join('')}</div>
      <div class="ago" data-since="${s.since}">${ago(s.since)}</div>
    </div>`;
  }

  function detail(s) {
    if (!s) return '';
    const subs = s.subagentList.map((a) => `<li>${esc(a.type ?? 'subagent')}: ${esc(a.description ?? '')} (${esc(STATE_TEXT[a.state] ?? a.state)})</li>`).join('');
    return `<div class="close">Esc to close</div>
      <h2>${esc(s.project)}${s.branch ? ` <span style="color:var(--dim);font-size:32px">${esc(s.branch)}</span>` : ''}</h2>
      <div style="color:var(--dim)">${esc(s.detail ?? STATE_TEXT[s.state])} · started ${new Date(s.started).toLocaleTimeString()} · ${esc(s.host ?? '')}</div>
      ${s.question ? `<div class="label">Question</div><div>${esc(s.question.text)}</div><div style="color:var(--dim)">${s.question.options.map(esc).join(' · ')}</div>` : ''}
      <div class="label">Summary</div><div>${esc(s.summary ?? '—')}</div>
      ${s.todo ? `<div class="label">Tasks</div><div>${s.todo.done} of ${s.todo.total} done${s.todo.current ? ` · now: ${esc(s.todo.current)}` : ''}</div>` : ''}
      ${subs ? `<div class="label">Subagents</div><ol>${subs}</ol>` : ''}
      ${s.lastMessage ? `<div class="label">Last message</div><div class="md">${markdown(s.lastMessage)}</div>` : ''}
      <div class="label">Recent activity</div><ol>${s.activity.map((a) => (a.startsWith('↳ ') ? `<li><span style="color:var(--dim)">▸ subagent:</span> ${esc(a.slice(2))}</li>` : `<li>${esc(a)}</li>`)).join('')}</ol>`;
  }

  function slideIds(sessions) {
    if (Date.now() < browsingUntil) return [];
    if (sessions.some((s) => s.needsYou || s.state === 'working')) return [];
    return sessions.filter((s) => s.state === 'waiting').map((s) => s.id);
  }

  function slide(s, ids) {
    const where = manyHosts ? shortHost(s.host) : '';
    const meta = [`Done <span class="slide-ago" data-since="${s.since}">${ago(s.since)}</span> ago`, s.branch && esc(s.branch), s.folder && s.folder !== s.project && esc(s.folder), where && esc(where)].filter(Boolean).join(' · ');
    const text = s.lastMessage ?? '';
    const size = text.length > 2200 ? ' longer' : text.length > 1400 ? ' long' : '';
    const hints = ['click for details', 'up or down for the board'];
    if (ids.length > 1) hints.unshift(`${ids.indexOf(s.id) + 1} of ${ids.length}`, 'left or right to step');
    return `<div class="slide" data-id="${s.id}">
      ${s.character ? `<div class="avatar-slot" data-key="${esc(avatarKey(s))}"></div>` : `<div class="avatar" style="--hue:${hue(s.project)}">${esc(s.project[0]?.toUpperCase() ?? '?')}</div>`}
      <h2>${esc(s.project)}</h2>
      <div><div class="meta">${meta}</div><div class="gist">${esc(s.summary ?? '')}</div></div>
      <div class="message md${size}">${markdown(text)}</div>
      <div class="footer">${hints.join(' · ')}</div>
    </div>`;
  }

  function stepSlide(delta) {
    const ids = slideIds(status.sessions);
    if (ids.length < 2) return;
    slideId = ids[(ids.indexOf(slideId) + delta + ids.length) % ids.length];
    render();
  }

  function restartSlides() {
    clearInterval(slideTimer);
    slideTimer = setInterval(() => stepSlide(1), SLIDE_MS);
  }

  function markdown(text) {
    return esc(text)
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/^\s*[-*]\s+/gm, '• ')
      .replace(/\n{3,}/g, '\n\n');
  }

  function chime() {
    try {
      const ctx = (chime.ctx ??= new AudioContext());
      [880, 1320].forEach((f, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.18);
        g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + i * 0.18 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.18 + 0.5);
        o.connect(g).connect(ctx.destination);
        o.start(ctx.currentTime + i * 0.18);
        o.stop(ctx.currentTime + i * 0.18 + 0.55);
      });
    } catch {}
  }

  function alertNew(sessions) {
    const now = new Set();
    for (const s of sessions) {
      if (!s.needsYou) continue;
      const key = `${s.id}|${s.since}`;
      now.add(key);
      if (!seenNeedsYou.has(key)) {
        const what = s.question ? 'has a question for you' : (s.detail ?? 'needs you').replace(/^Needs permission: /, 'wants to run ').replace(/ \(([^()]+)\)$/, ' (subagent)');
        $('banner').querySelector('.text').innerHTML = `<span class="project">${esc(s.project)}</span> ${esc(what)}`;
        $('banner').classList.add('show');
        clearTimeout(bannerTimer);
        bannerTimer = setTimeout(() => $('banner').classList.remove('show'), 10000);
        if (!status?.quiet) chime();
      }
    }
    seenNeedsYou = now;
  }

  function fitRows(sessions, height) {
    const cost = (s) => (COMPACT.has(s.state) ? ROW_HEIGHT.compact : ROW_HEIGHT.full);
    let used = 0;
    let count = 0;
    for (const s of sessions) {
      const next = used + (count ? ROW_HEIGHT.gap : 0) + cost(s);
      const reserve = count + 1 < sessions.length ? ROW_HEIGHT.gap + ROW_HEIGHT.more : 0;
      if (next + reserve > height) break;
      used = next;
      count++;
    }
    return sessions.slice(0, Math.max(count, 1));
  }

  function render() {
    const sessions = status.sessions;
    const shown = fitRows(sessions, $('rows').clientHeight);
    manyHosts = new Set(sessions.map((s) => shortHost(s.host))).size > 1;
    const ids = slideIds(sessions);
    if (ids.length && !ids.includes(slideId)) {
      slideId = ids[0];
      restartSlides();
    }
    $('rows').innerHTML = ids.length
      ? slide(sessions.find((s) => s.id === slideId), ids)
      : sessions.length
      ? shown.map(row).join('') + (shown.length < sessions.length ? `<div class="more">+${sessions.length - shown.length} more</div>` : '')
      : '<div class="empty">No agents running</div>';
    mountAvatars(sessions);
    const needs = sessions.filter((s) => s.needsYou).length;
    const working = sessions.filter((s) => s.state === 'working').length;
    const waiting = sessions.filter((s) => s.state === 'waiting').length;
    $('counts').innerHTML = sessions.length ? [needs && `<b>${needs}</b> need you`, working && `<b>${working}</b> working`, waiting && `<b>${waiting}</b> waiting`].filter(Boolean).join(' · ') : '';
    $('lamp').classList.toggle('live', needs > 0);
    document.title = needs ? `(${needs}) Tally` : 'Tally';
    $('detail').innerHTML = detail(sessions.find((s) => s.id === openId));
    $('detail').classList.toggle('show', Boolean(openId && sessions.some((s) => s.id === openId)));
  }

  function tick() {
    $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    document.querySelectorAll('.ago, .slide-ago').forEach((el) => (el.textContent = ago(el.dataset.since)));
  }

  let first = true;
  function update(next) {
    status = next;
    if (first) {
      seenNeedsYou = new Set(status.sessions.filter((s) => s.needsYou).map((s) => `${s.id}|${s.since}`));
      first = false;
    } else alertNew(status.sessions);
    $('offline').classList.remove('show');
    render();
  }

  function connect() {
    const params = new URLSearchParams(location.search);
    if (params.has('demo')) {
      const at = (offset) => new Date(Date.now() + Number(offset) * 1000).toISOString();
      fetch('/demo.json')
        .then((r) => r.json())
        .then((demo) => update({ ...demo, sessions: demo.sessions.map((s) => ({ ...s, since: at(s.since), lastEvent: at(s.lastEvent), started: at(s.started) })) }))
        .then(() => {
          if (params.has('banner')) {
            seenNeedsYou = new Set();
            alertNew(status.sessions.slice(1, 2));
          }
          if (params.has('open')) {
            openId = params.get('open');
            render();
          }
        });
      return;
    }
    if (params.has('poll')) {
      const poll = () =>
        fetch('/status')
          .then((r) => r.json())
          .then(update)
          .catch(() => $('offline').classList.add('show'));
      poll();
      setInterval(poll, 3000);
      return;
    }
    const source = new EventSource('/stream');
    source.onmessage = (m) => update(JSON.parse(m.data));
    source.onerror = () => $('offline').classList.add('show');
  }

  $('rows').addEventListener('click', (e) => {
    const el = e.target.closest('.row[data-id], .slide[data-id]');
    if (el) {
      openId = el.dataset.id;
      render();
    }
  });
  $('detail').addEventListener('click', () => {
    openId = null;
    render();
  });
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      openId = null;
      render();
    } else if (!openId && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      stepSlide(e.key === 'ArrowLeft' ? -1 : 1);
      restartSlides();
    } else if (!openId && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && slideIds(status.sessions).length) {
      browsingUntil = Date.now() + BROWSE_MS;
      render();
      setTimeout(render, BROWSE_MS + 50);
    }
  });
  addEventListener('resize', fit);
  fit();
  tick();
  setInterval(tick, 1000);
  connect();
</script>
</body>
</html>
